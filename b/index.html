<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your booking · PatchWork Live</title>
<!-- fix1787 (StageSuite cloud shows stage 3, owner B1.1 B2.1 L3.2): the crew booking page. A text from the Crew page
     links here with the booking's id after '#'. The page opens 2ndRodeo when the phone has it (secondrodeo://b/ID);
     without it, the booking is shown here with I'm in / Can't make it, which write the answer to the booking in
     Firestore (the rules allow only the answer fields, no account needed) so FOH sees it at once. Published with
     GitHub Pages from the public repo JesseStover/stagesuite-site (a copy of docs/ — push there too when this changes): https://jessestover.github.io/stagesuite-site/b/#ID -->
<style>
  :root { color-scheme: light dark; --fg: #111; --bg: #fff; --muted: #666; --line: #ddd; --blue: #1e63d6; --green: #1f8f3e; --red: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #121212; --muted: #aaa; --line: #333; } }
  body { margin: 0; font: 17px/1.4 Barlow, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .day { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
  .day h2 { font-size: 19px; margin: 0 0 4px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { flex: 1; font: inherit; font-weight: 700; padding: 12px; border-radius: 10px; border: 2px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; min-height: 48px; }
  button.in.on { border-color: var(--green); background: var(--green); color: #fff; }
  button.cant.on { border-color: var(--red); background: var(--red); color: #fff; }
  .app { display: block; text-align: center; text-decoration: none; margin: 18px 0 8px; padding: 14px; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 800; }
  .get { display: block; text-align: center; color: var(--blue); }
  #err { color: var(--red); font-weight: 700; }
  .ok { color: var(--green); font-weight: 700; }
</style>
</head>
<body>
<main>
  <p class="muted" style="margin:0 0 10px">PatchWork Live · crew booking</p>
  <div id="app"><p>Reading your booking…</p></div>
  <p id="err"></p>
  <a id="open" class="app" href="#" style="display:none">Open in 2ndRodeo</a>
  <a id="get" class="get" href="https://play.google.com/store/apps/details?id=com.secondrodeo.crew" style="display:none">Get 2ndRodeo — your jobs on the night, ticked from your phone</a>
</main>
<script>
(function () {
  var PROJECT = 'stagesuite-99334';
  var KEY = 'AIzaSyD9ggCCfb_N3CGl--Dms5fxfUAcUF7zxy4'; // the project's public Firebase key (google-services.json)
  var id = (location.hash || '').replace(/^#/, '').trim();
  var app = document.getElementById('app'), err = document.getElementById('err');
  var openA = document.getElementById('open'), getA = document.getElementById('get');
  if (!id) { app.innerHTML = '<p>This link has no booking on it.</p>'; return; }
  var url = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/bookings/' + encodeURIComponent(id);
  var android = /Android/i.test(navigator.userAgent);
  if (android) {
    openA.href = 'intent://b/' + encodeURIComponent(id) + '#Intent;scheme=secondrodeo;package=com.secondrodeo.crew;S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end';
    openA.style.display = 'block';
  }
  getA.style.display = 'block';

  function phoneId() {
    try {
      var p = localStorage.getItem('ss_phone');
      if (!p) { p = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); localStorage.setItem('ss_phone', p); }
      return p;
    } catch (e) { return 'web'; }
  }
  function val(f) { // one Firestore REST value → plain JS
    if (!f) return null;
    if ('stringValue' in f) return f.stringValue;
    if ('integerValue' in f) return +f.integerValue;
    if ('booleanValue' in f) return f.booleanValue;
    if ('mapValue' in f) { var o = {}; var fs = f.mapValue.fields || {}; for (var k in fs) o[k] = val(fs[k]); return o; }
    if ('arrayValue' in f) return (f.arrayValue.values || []).map(val);
    return null;
  }
  function clock(t) { // '15:30' → '3:30 pm'
    var m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); if (!m) return t || '';
    var h = +m[1]; return (h % 12 || 12) + ':' + m[2] + (h < 12 ? ' am' : ' pm');
  }
  function dayName(d) {
    var dt = new Date(d + 'T12:00:00'); if (isNaN(dt)) return d;
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()] + ' ' + dt.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var doc = null;
  function render() {
    var days = doc.days || [], answers = doc.answers || {};
    var h = '<h1>' + esc(doc.show || 'Show') + '</h1>';
    if (doc.venue) h += '<p class="muted" style="margin:0">' + esc(doc.venue) + '</p>';
    h += '<p>' + esc(doc.name || '') + (doc.sections && doc.sections.length ? ' · ' + esc(doc.sections.join(', ')) : '') + '</p>';
    days.forEach(function (d) {
      var a = answers[d.id] || '';
      h += '<div class="day"><h2>' + esc(dayName(d.date)) + '</h2>';
      h += '<div class="muted">' + [d.call ? 'Call ' + clock(d.call) : '', d.start ? 'first act ' + clock(d.start) : ''].filter(Boolean).join(' · ') + '</div>';
      h += '<div class="row"><button class="in' + (a === 'in' ? ' on' : '') + '" data-day="' + esc(d.id) + '" data-a="in">I\'m in</button>';
      h += '<button class="cant' + (a === 'cant' ? ' on' : '') + '" data-day="' + esc(d.id) + '" data-a="cant">Can\'t make it</button></div></div>';
    });
    h += '<p class="muted" id="note">' + (Object.keys(answers).some(function (k) { return answers[k]; }) ? 'Your answer is in — FOH sees it. Tap again to change it.' : 'Tap an answer for each day — FOH sees it at once.') + '</p>';
    app.innerHTML = h;
    Array.prototype.forEach.call(app.querySelectorAll('button'), function (b) {
      b.onclick = function () { answer(b.getAttribute('data-day'), b.getAttribute('data-a')); };
    });
  }
  function answer(dayId, a) {
    var cur = (doc.answers || {})[dayId] || '';
    var next = cur === a ? '' : a; // tap again: no answer
    var body = { fields: { answers: { mapValue: { fields: {} } }, answeredAt: { timestampValue: new Date().toISOString() }, phoneId: { stringValue: phoneId() } } };
    body.fields.answers.mapValue.fields[dayId] = { stringValue: next };
    var q = '?updateMask.fieldPaths=answers.' + encodeURIComponent(dayId) + '&updateMask.fieldPaths=answeredAt&updateMask.fieldPaths=phoneId&key=' + KEY;
    err.textContent = '';
    fetch(url + q, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { doc = val({ mapValue: { fields: j.fields } }); render(); })
      .catch(function (e) { err.textContent = "Couldn't send your answer (" + e.message + ") — try again with the internet on, or answer in 2ndRodeo."; });
  }
  fetch(url + '?key=' + KEY)
    .then(function (r) { if (r.status === 404) throw new Error('gone'); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) { doc = val({ mapValue: { fields: j.fields } }); render(); })
    .catch(function (e) {
      app.innerHTML = '';
      err.textContent = e.message === 'gone' ? 'This booking was taken back.' : "Couldn't read the booking (" + e.message + "). Check the internet and try again.";
    });
})();
</script>
</body>
</html>
